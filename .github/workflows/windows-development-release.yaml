# Build and publish the Linux development release on pushes to development.
name: Linux Development Release

on:
  push:
    branches:
      - development
    paths-ignore:
      - '.github/ISSUE_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/development-db-dump.yaml'
      - '.github/workflows/pr-sql-check.yaml'
      - '.gitignore'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'
      - 'sql/**'

concurrency:
  group: linux-development-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux development release
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libace-dev \
            libboost-all-dev \
            libbz2-dev \
            libmariadb-dev \
            libmariadb-dev-compat \
            libreadline-dev \
            libssl-dev \
            libtbb-dev \
            zlib1g-dev \
            zip

      - name: Configure release build
        run: |
          set -euo pipefail

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DBUILD_EXTRACTORS=1

      - name: Build release binaries
        run: |
          set -euo pipefail
          cmake --build build --parallel "$(nproc)"

      - name: Install release files
        run: |
          set -euo pipefail
          cmake --install build

      - name: Set release archive filename
        run: |
          echo "ARCHIVE_FILENAME=dev-$(git rev-parse --short HEAD).zip" >> "$GITHUB_ENV"

      - name: Create release archive
        run: |
          set -euo pipefail

          cd "${{ github.workspace }}/install"
          zip -r "${{ github.workspace }}/${{ env.ARCHIVE_FILENAME }}" .

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-development-build
          path: "${{ github.workspace }}/${{ env.ARCHIVE_FILENAME }}"
          if-no-files-found: error

  publish:
    name: Publish Linux development release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          pattern: linux-development-build
          merge-multiple: true
          path: release-assets

      - name: Publish release snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./.github/scripts/publish-moving-release.sh \
            latest \
            "Linux Development Build" \
            release-assets
